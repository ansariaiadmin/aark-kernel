version: 2

# Dependency update policy
# ------------------------
# Dependabot opens pull requests only for minor and patch updates, and groups
# them so a reviewer sees one small PR per ecosystem instead of a flood.
#
# Major version bumps are deliberately excluded: a major bump is a design
# decision (a new framework major, a new Python or Node runtime, a breaking
# API change), not something to land silently between other work. They are
# picked up by hand, one at a time, with the release notes read.
#
# Security patches inside a supported major series still arrive automatically
# through the minor and patch groups.

updates:
  # Python dependencies (backend)
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - backend
    commit-message:
      prefix: "build"
      include: scope
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    groups:
      # Batch low-risk patch updates to reduce review noise.
      python-patch:
        patterns:
          - "*"
        update-types:
          - patch
      # Security-relevant packages are updated individually.
      python-security:
        patterns:
          - "fastapi"
          - "starlette"
          - "uvicorn"
          - "pydantic"
          - "sqlalchemy"
          - "bcrypt"
          - "pyjwt"
          - "cryptography"
          - "httpx"
          - "aiohttp"
        update-types:
          - minor
          - patch

  # Node dependencies (frontend)
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - frontend
    commit-message:
      prefix: "build"
      include: scope
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    groups:
      node-patch:
        patterns:
          - "*"
        update-types:
          - patch
      node-security:
        patterns:
          - "next"
          - "react"
          - "react-dom"
        update-types:
          - minor
          - patch

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "ci"
      include: scope
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    groups:
      actions-minor:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # Docker base images
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: monthly
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: "build"
      include: scope
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    groups:
      docker-backend:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: monthly
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: "build"
      include: scope
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    groups:
      docker-frontend:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
