name: CodeQL

# Static security analysis. Runs on the default branch, on pull requests, and
# weekly to catch newly published vulnerability patterns.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 5 * * 1"   # Mondays 05:30 UTC

permissions:
  contents: read
  # CodeQL uploads its SARIF results to the code scanning API. Without this
  # permission the analysis runs to completion and then fails at upload, which
  # is what happened on the first pushes to main: the job reported failure even
  # though nothing was wrong with the code.
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          language: ${{ matrix.language }}
          queries: security-and-quality

      # JavaScript/TypeScript needs dependencies present for full analysis.
      - name: Set up Node
        if: matrix.language == 'javascript-typescript'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        if: matrix.language == 'javascript-typescript'
        run: npm ci --ignore-scripts
        working-directory: frontend

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
