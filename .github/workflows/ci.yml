name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# One source of truth for the versions used by every job.
env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"
  # NOTE: this was `test_secret_32_bytes_min_for_ci` — 31 characters, one short
  # of the `min_length=32` validator on Settings.API_SECRET_KEY. Every CI run
  # therefore died during *collection* with a pydantic ValidationError and no
  # test ever executed.
  API_SECRET_KEY: "ci_secret_key_that_is_at_least_32_chars_long"
  DATABASE_URL: "postgresql+asyncpg://test:test@localhost:5432/test"
  REDIS_URL: "redis://:test@localhost:6379/0"

jobs:
  backend:
    name: Backend — lint + type + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Import smoke test — every module must load
        # Catches wiring regressions that unit tests with mocks cannot see:
        # a missing router include, a circular import, a renamed symbol.
        run: python -c "from app.main import app; n=len(app.openapi()['paths']); print('openapi paths:', n); assert n >= 38, n"

      - name: Tests
        run: python -m pytest tests/ -q

      - name: Compile check
        run: python -m compileall -q app

  frontend:
    name: Frontend — lint + typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npx eslint .

      - name: Typecheck (tsc)
        run: npx tsc --noEmit

      - name: Build (next build)
        # This is the step that was missing entirely: `next build` failed on
        # `_e` ReferenceErrors and a missing `recharts` dependency, so the
        # frontend Docker image could never be built and install.sh aborted.
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  docker:
    name: Docker — compose config + images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Materialise .env from .env.example
        # compose `env_file: .env` is now optional, but validating against the
        # real documented env surface catches drift between .env.example and
        # docker-compose.yml (e.g. a variable referenced but never documented).
        run: |
          cp .env.example .env
          # Placeholders in .env.example are not valid secrets; the backend
          # rejects an API_SECRET_KEY shorter than 32 characters at startup.
          python - <<'PYEOF'
          import pathlib, re, secrets
          p = pathlib.Path(".env")
          s = p.read_text()
          s = re.sub(r"(?m)^(API_SECRET_KEY|POSTGRES_PASSWORD|REDIS_PASSWORD)=.*$",
                     lambda m: f"{m.group(1)}={secrets.token_urlsafe(32)}", s)
          p.write_text(s)
          PYEOF

      - name: Docker compose config check
        run: docker compose config

      - name: Fail on undocumented compose variables
        # Every ${VAR} referenced by compose must exist in .env.example,
        # otherwise a fresh install silently gets a blank value.
        run: |
          python - <<'PYEOF'
          import pathlib, re, sys

          # Strip comment lines first: the header of docker-compose.yml explains
          # the rule itself using "${VAR}" as a placeholder, which is not a real
          # reference and must not be treated as one.
          compose_raw = pathlib.Path("docker-compose.yml").read_text()
          compose = "\n".join(
              line for line in compose_raw.splitlines() if not line.lstrip().startswith("#")
          )
          example = pathlib.Path(".env.example").read_text()

          documented = {m.group(1) for m in re.finditer(r"(?m)^([A-Z0-9_]+)=", example)}
          referenced = {m.group(1) for m in re.finditer(r"\$\{([A-Z0-9_]+)(?::?[-?][^}]*)?\}", compose)}
          # A variable with an inline default is safe even when undocumented.
          defaulted = {m.group(1) for m in re.finditer(r"\$\{([A-Z0-9_]+):-", compose)}

          missing = sorted(referenced - documented - defaulted)
          if missing:
              sys.exit(f"compose references undocumented env vars: {missing}")
          print(f"OK: {len(referenced)} referenced, {len(documented)} documented")
          PYEOF

      - name: Build images (no push)
        run: docker compose build --no-cache backend frontend

  # Single required status for branch protection.
  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [backend, frontend, docker]
    if: always()
    steps:
      - name: Check results
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] || \
             [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::one or more CI jobs did not succeed"
            exit 1
          fi
          echo "All CI jobs succeeded"
