name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          pip install ruff pytest pytest-asyncio
          pip install -r backend/requirements.txt
      - name: Lint (ruff)
        run: ruff check backend/ --exclude backend/.venv
      - name: Tests (46 passed)
        env:
          API_SECRET_KEY: test_secret_32_bytes_min_for_ci
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
          REDIS_URL: redis://:test@localhost:6379/0
        run: |
          cd backend
          python -m pytest tests/ -q
      - name: Compile check
        run: python -m py_compile backend/app/main.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker compose config check
        run: docker compose config
      - name: Build images (no push)
        run: docker compose build --no-cache backend frontend
