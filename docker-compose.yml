version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: aark-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aark_db}
      POSTGRES_USER: ${POSTGRES_USER:-aark_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_aark_pass_2026}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aark_admin} -d ${POSTGRES_DB:-aark_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aark-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_aark_secure}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_aark_secure}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aark-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-aark_admin}:${POSTGRES_PASSWORD:-secure_aark_pass_2026}@postgres:5432/${POSTGRES_DB:-aark_db}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_aark_secure}@redis:6379/0
      API_SECRET_KEY: ${API_SECRET_KEY:-default_super_secret_jwt_key_32bytes_min}
      LOCAL_OLLAMA_HOST: ${LOCAL_OLLAMA_HOST:-http://host.docker.internal:11434}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      ENVIRONMENT: production
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${AARK_BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aark-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${AARK_BACKEND_PORT:-8000}/api/v1
    ports:
      - "127.0.0.1:${AARK_FRONTEND_PORT:-3000}:3000"

volumes:
  pgdata:
  redisdata: